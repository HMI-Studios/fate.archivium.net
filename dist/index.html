<!DOCTYPE html>
<html>
    <head>
        <title>Archivium Fate</title>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Raleway&family=Roboto&display=swap" rel="stylesheet">
        <link href="https://archivium.net/static/assets/styles.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="https://archivium.net/static/assets/icons/archivium.ico">
        <!-- The icons in Archivium's rich-text editor's toolbar (as in Archivium's templates/layout.pug). -->
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=code,code_blocks,format_align_center,format_align_justify,format_align_left,format_align_right,format_bold,format_clear,format_h1,format_h2,format_h3,format_h4,format_h5,format_h6,format_italic,format_list_bulleted,format_list_numbered,format_paragraph,format_quote,horizontal_rule,image,link,link_off,redo,strikethrough_s,subscriptions,toc,undo,view_sidebar" rel="stylesheet">
        <style>
            .material-symbols-outlined {
                font-size: 1.5rem;
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 16
            }
        </style>
        <!-- Start Single Page Apps for GitHub Pages -->
        <!-- (Refer to 404.html for full license) -->
        <script type="text/javascript">
            // Single Page Apps for GitHub Pages
            // MIT License
            // https://github.com/rafgraph/spa-github-pages
            // This script checks to see if a redirect is present in the query string,
            // converts it back into the correct url and adds it to the
            // browser's history using window.history.replaceState(...),
            // which won't cause the browser to attempt to load the new url.
            // When the single page app is loaded further down in this file,
            // the correct url will be waiting in the browser's history for
            // the single page app to route accordingly.
            (function(l) {
                if (l.search[1] === '/' ) {
                    var decoded = l.search.slice(1).split('&').map(function(s) { 
                        return s.replace(/~and~/g, '&')
                    }).join('?');
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            }(window.location))
        </script>
        <!-- End Single Page Apps for GitHub Pages -->
    </head>
    <body>
        <div id="app"></div>
        <!-- Archivium's editor opens its dialogs here; above the app's floating panels. -->
        <div id="modal-anchor" style="position: relative; z-index: 100"></div>
        <script src="/bundle.js"></script>
    </body>
</html>
